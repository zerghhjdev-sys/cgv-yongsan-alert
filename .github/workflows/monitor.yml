name: CGV 용산 감시

on:
  schedule:
    - cron: "3-58/5 * * * *"   # 5분마다 (정각 혼잡을 피해 3분 오프셋)
    - cron: "10 23 * * *"      # KST 08:10 하루 한 번 생존 신고
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "진단만 실행 (알림 안 보냄). siteNo 검증용"
        type: boolean
        default: true
      diagnostic_date:
        description: "진단할 날짜 - 이미 예매가 열린 날 (YYYYMMDD). 비우면 내일 날짜"
        type: string
        default: ""
      test_telegram:
        description: "텔레그램 발송 테스트만 실행 (CGV 조회 안 함)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: cgv-yongsan-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: Chrome 확인
        # 러너에 Chrome이 기본 설치돼 있습니다. 경로만 확인합니다.
        run: |
          which google-chrome || which google-chrome-stable || which chromium || true
          google-chrome --version || google-chrome-stable --version || true

      - name: CGV 감시
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 용산 siteNo. 저장소 Variables 에 SITE_NO 를 넣으면 그 값이 우선합니다.
          SITE_NO: ${{ vars.SITE_NO || '0013' }}
          SITE_NM: 용산아이파크몰
          TARGET_DATES: "20260828,20260829"
          # 하루 한 번 도는 스케줄일 때만 생존 신고
          HEARTBEAT: ${{ github.event.schedule == '10 23 * * *' }}
          DIAGNOSTIC_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only || 'false' }}
          DIAGNOSTIC_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_date || '' }}
          TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram || 'false' }}
        run: node monitor.js
